name: ClipFleet Pipeline (free-tier bounded)
on:
  schedule:
    - cron: '15 */6 * * *'
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: clipfleet-agent-loop
  cancel-in-progress: false
jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CLIPFLEET_WORKER_URL: ${{ vars.CLIPFLEET_WORKER_URL }}
      CLIPFLEET_ADMIN_TOKEN: ${{ secrets.CLIPFLEET_ADMIN_TOKEN }}
      CLIPFLEET_ASSET_HOSTS: ${{ vars.CLIPFLEET_ASSET_HOSTS }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Ensure video tooling
        run: command -v ffmpeg && command -v ffprobe || { sudo apt-get update && sudo apt-get install -y ffmpeg; }
      - name: Resolve deployed Worker URL from Cloudflare (unless explicitly configured)
        shell: bash
        run: |
          if [ -n "${CLIPFLEET_WORKER_URL:-}" ]; then exit 0; fi
          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ] || [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo 'No Cloudflare credentials configured for URL discovery'; exit 0
          fi
          subdomain=$(curl -fsS --retry 2 -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" | python -c 'import json,sys;print((json.load(sys.stdin).get("result") or {}).get("subdomain") or "")' || true)
          if [ -n "$subdomain" ]; then
            echo "CLIPFLEET_WORKER_URL=https://clipfleet-ops.$subdomain.workers.dev" >> "$GITHUB_ENV"
          fi
      - name: Discover and score public campaigns
        run: python -m clipfleet discover --max-details 25 --output artifacts/discovered.json
      - name: Import public campaign intelligence directly into Cloudflare D1
        if: ${{ env.CLOUDFLARE_ACCOUNT_ID != '' && env.CLOUDFLARE_API_TOKEN != '' }}
        run: python -m clipfleet import-d1 --file artifacts/discovered.json
      - name: Plan previously reviewed and approved campaigns
        if: ${{ env.CLIPFLEET_WORKER_URL != '' && env.CLIPFLEET_ADMIN_TOKEN != '' }}
        run: python -m clipfleet plan
      - name: Render authorized jobs, max 2 per run
        if: ${{ env.CLIPFLEET_WORKER_URL != '' && env.CLIPFLEET_ADMIN_TOKEN != '' }}
        run: python -m clipfleet batch --max-jobs 2 --output-dir artifacts
      - name: Export discovery, clips and compliance manifests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clipfleet-${{ github.run_id }}
          path: artifacts/**
          retention-days: 7
          if-no-files-found: warn
