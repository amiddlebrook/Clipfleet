name: Dispatch Grok Bot review tasks
on:
  schedule:
    - cron: '24,54 * * * *'
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'scripts/dispatch_grokbot.py'
      - '.github/workflows/grokbot-dispatch.yml'
permissions:
  contents: read
concurrency:
  group: clipfleet-grokbot-dispatch
  cancel-in-progress: false
jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLIPFLEET_WORKER_URL: ${{ vars.CLIPFLEET_WORKER_URL }}
      CLIPFLEET_ADMIN_TOKEN: ${{ secrets.CLIPFLEET_ADMIN_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      GROKBOT_WEBHOOK_URL: ${{ secrets.GROKBOT_WEBHOOK_URL }}
      GROKBOT_WEBHOOK_KEY: ${{ secrets.GROKBOT_WEBHOOK_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resolve deployed Worker URL
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${CLIPFLEET_WORKER_URL:-}" ]; then exit 0; fi
          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ] || [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "Missing Cloudflare URL and credentials" >&2; exit 1
          fi
          subdomain=$(curl -fsS --retry 2 -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" \
            | python -c 'import json,sys;print((json.load(sys.stdin).get("result") or {}).get("subdomain") or "")')
          test -n "$subdomain"
          echo "CLIPFLEET_WORKER_URL=https://clipfleet-ops.$subdomain.workers.dev" >> "$GITHUB_ENV"
      - name: Start Grok Bot routines for approved rendered clips
        run: python scripts/dispatch_grokbot.py
